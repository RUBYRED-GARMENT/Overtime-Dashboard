<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubyred | Overtime Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #150a0b;
    --bg-elevated: #1e1012;
    --surface: #251215;
    --surface-hover: #2d151a;
    --border: #3c1c20;
    --accent: #8f1d3a;
    --accent-bright: #d1263f;
    --text: #f3e7e5;
    --text-muted: #ac8b8e;
    --text-faint: #7a6265;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(143,29,58,0.28), transparent 60%),
      var(--bg);
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- language switcher ---------- */
  .lang-switch {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .lang-switch button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    padding: 7px 12px;
    letter-spacing: 0.3px;
  }
  .lang-switch button + button { border-inline-start: 1px solid var(--border); }
  .lang-switch button.active { background: var(--accent); color: #fff; }

  /* ---------- splash screen ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg);
    text-align: center;
    transition: opacity 0.6s ease;
  }
  #splash.fade-out { opacity: 0; pointer-events: none; }
  .splash-mark {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(14px) scale(0.96);
    animation: splashIn 0.8s ease forwards;
  }
  .splash-mark span { color: var(--accent-bright); }
  .splash-tagline {
    margin-top: 10px;
    font-size: 16px;
    color: var(--text-muted);
    opacity: 0;
    animation: splashIn 0.8s ease forwards;
    animation-delay: 0.25s;
  }
  .splash-bar {
    margin-top: 26px;
    width: 160px; height: 3px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .splash-bar::after {
    content: "";
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent-bright);
    animation: splashBar 2.1s ease forwards;
  }
  @keyframes splashIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes splashBar { to { width: 100%; } }

  /* ---------- login screen ---------- */
  #loginScreen {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #loginScreen.visible { display: flex; }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(135deg, var(--surface), var(--bg-elevated));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
  }
  .login-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }
  .login-brand { font-size: 20px; font-weight: 900; }
  .login-brand span { color: var(--accent-bright); }
  .login-title { font-size: 15px; color: var(--text-muted); margin: 0 0 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 8px;
    outline: none;
  }
  .field input:focus { border-color: var(--accent-bright); }
  .login-submit {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 6px;
  }
  .login-submit:hover { background: var(--accent-bright); }
  .login-error { color: var(--accent-bright); font-size: 13px; margin-top: 12px; min-height: 16px; }
  .shake { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ---------- dashboard ---------- */
  #dashboard { display: none; }
  #dashboard.visible { display: block; }
  .page { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 20px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .brand-mark { font-weight: 900; font-size: 32px; color: var(--text); letter-spacing: 0.5px; }
  .brand-mark span { color: var(--accent-bright); }
  .brand-sub { display: block; margin-top: 4px; font-size: 15px; color: var(--text-muted); font-weight: 400; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
  [dir="rtl"] .header-right { align-items: flex-start; }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .field-inline { display: flex; flex-direction: column; gap: 6px; }
  .field-inline label { font-size: 13px; color: var(--text-muted); }
  .field-inline input[type="date"], .field-inline select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 8px;
    outline: none;
    color-scheme: dark;
    min-width: 160px;
  }
  .field-inline input:focus, .field-inline select:focus { border-color: var(--accent-bright); }
  .btn-download {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .btn-download:hover { background: var(--accent-bright); }
  .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, var(--surface), var(--bg-elevated));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 26px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .stat-value { font-size: 40px; font-weight: 900; color: var(--accent-bright); line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-label { display: block; margin-top: 6px; font-size: 14px; color: var(--text-muted); }
  .stat-date { font-size: 15px; color: var(--text-muted); text-align: end; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  thead th { text-align: start; font-size: 13px; font-weight: 500; color: var(--text-faint); padding: 14px 20px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td { padding: 14px 20px; font-size: 15px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-hover); }
  tbody td:first-child { color: var(--text-muted); font-variant-numeric: tabular-nums; width: 100px; }
  .state-msg { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 15px; }
  .state-msg.error { color: var(--accent-bright); }
  .state-msg:empty { display: none; }
  footer { margin-top: 28px; text-align: center; font-size: 13px; color: var(--text-faint); }
</style>
</head>
<body>

  <!-- Splash / welcome animation -->
  <div id="splash">
    <div class="splash-mark">Ruby<span>red</span></div>
    <div class="splash-tagline" data-i18n="welcomeText">Welcome to Rubyred Overtime Dashboard</div>
    <div class="splash-bar"></div>
  </div>

  <!-- Login screen -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-top">
        <div class="login-brand">Ruby<span>red</span></div>
        <div class="lang-switch" data-lang-switch>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="ar">AR</button>
        </div>
      </div>
      <p class="login-title" data-i18n="loginTitle">Sign In</p>
      <form id="loginForm">
        <div class="field">
          <label for="loginId" data-i18n="loginId">ID</label>
          <input type="text" id="loginId" autocomplete="username">
        </div>
        <div class="field">
          <label for="loginPassword" data-i18n="loginPassword">Password</label>
          <input type="password" id="loginPassword" autocomplete="current-password">
        </div>
        <button type="submit" class="login-submit" data-i18n="loginButton">Sign In</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="page">
      <header>
        <div>
          <div class="brand-mark">Ruby<span>red</span></div>
          <span class="brand-sub" data-i18n="brandSub">Daily Overtime Log</span>
        </div>
        <div class="header-right">
          <div class="lang-switch" data-lang-switch>
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="tr">TR</button>
            <button type="button" data-lang="ar">AR</button>
          </div>
          <div class="filters">
            <div class="field-inline">
              <label for="dateInput" data-i18n="dateLabel">Date</label>
              <input type="date" id="dateInput">
            </div>
            <div class="field-inline">
              <label for="deptFilter" data-i18n="departmentLabel">Department</label>
              <select id="deptFilter">
                <option value="" data-i18n="allDepartments">All Departments</option>
              </select>
            </div>
            <button type="button" class="btn-download" id="downloadBtn" data-i18n="downloadExcel">Download Excel</button>
          </div>
        </div>
      </header>

      <section class="summary">
        <div>
          <span class="stat-value" id="countValue">—</span>
          <span class="stat-label" data-i18n="statLabel">Workers on Overtime</span>
        </div>
        <div class="stat-date" id="displayDate">—</div>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="tableCode">Code</th>
              <th data-i18n="tableName">Name</th>
              <th data-i18n="tableDept">Department</th>
              <th data-i18n="tableJd">JD</th>
              <th data-i18n="tableType">Type</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="stateMsg" class="state-msg"></div>
      </section>

      <footer data-i18n="footer">Rubyred — Overtime Tracking System</footer>
    </div>
  </div>

<script>
  /* ============ CONFIG ============ */
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw2CaIHDHhf5hO3inP0MCEYZ8Sw_jFskBNTefEob3Gsq24gEhVzirVygE7rdAEtAv4T/exec";
  const CREDENTIALS = { id: "RUBYRED", password: "RUBYRED2006" };

  /* ============ TRANSLATIONS ============ */
  const translations = {
    en: {
      pageTitle: "Rubyred | Overtime Dashboard",
      brandSub: "Daily Overtime Log",
      dateLabel: "Date",
      departmentLabel: "Department",
      allDepartments: "All Departments",
      statLabel: "Workers on Overtime",
      tableCode: "Code",
      tableName: "Name",
      tableDept: "Department",
      tableJd: "JD",
      tableType: "Type",
      downloadExcel: "Download Excel",
      loading: "Loading data...",
      noData: "No data available for this date",
      noWorkers: "No overtime workers recorded on this day",
      errorMsg: "Connection error. Please check the Web App URL and deployment settings.",
      needUrl: "Please set the Web App URL in the code first (WEB_APP_URL variable).",
      footer: "Rubyred — Overtime Tracking System",
      loginTitle: "Sign In",
      loginId: "ID",
      loginPassword: "Password",
      loginButton: "Sign In",
      loginError: "Incorrect ID or password",
      welcomeText: "Welcome to Rubyred Overtime Dashboard"
    },
    tr: {
      pageTitle: "Rubyred | Fazla Mesai Paneli",
      brandSub: "Günlük Fazla Mesai Kaydı",
      dateLabel: "Tarih",
      departmentLabel: "Departman",
      allDepartments: "Tüm Departmanlar",
      statLabel: "Fazla Mesai Yapan Personel",
      tableCode: "Kod",
      tableName: "İsim",
      tableDept: "Departman",
      tableJd: "Görev Tanımı",
      tableType: "Tür",
      downloadExcel: "Excel İndir",
      loading: "Veriler yükleniyor...",
      noData: "Bu tarih için veri bulunmuyor",
      noWorkers: "Bu tarihte kayıtlı fazla mesai personeli yok",
      errorMsg: "Bağlantı hatası. Lütfen Web App bağlantısını ve yayın ayarlarını kontrol edin.",
      needUrl: "Önce kodda Web App bağlantısını ayarlamanız gerekiyor (WEB_APP_URL değişkeni).",
      footer: "Rubyred — Fazla Mesai Takip Sistemi",
      loginTitle: "Giriş Yap",
      loginId: "Kullanıcı Adı",
      loginPassword: "Şifre",
      loginButton: "Giriş Yap",
      loginError: "Kullanıcı adı veya şifre hatalı",
      welcomeText: "Rubyred Fazla Mesai Paneline Hoş Geldiniz"
    },
    ar: {
      pageTitle: "روبي ريد | لوحة العمل الإضافي",
      brandSub: "سجل العمل الإضافي اليومي",
      dateLabel: "التاريخ",
      departmentLabel: "القسم",
      allDepartments: "جميع الأقسام",
      statLabel: "عامل مسجَّل للعمل الإضافي",
      tableCode: "الكود",
      tableName: "الاسم",
      tableDept: "القسم",
      tableJd: "المسمى الوظيفي",
      tableType: "النوع",
      downloadExcel: "تحميل إكسل",
      loading: "جارٍ تحميل البيانات...",
      noData: "لا توجد بيانات لهذا التاريخ",
      noWorkers: "لا يوجد عمال مسجَّلون للعمل الإضافي في هذا اليوم",
      errorMsg: "حدث خطأ في الاتصال بالبيانات. يُرجى التأكد من رابط الـ Web App وإعدادات النشر.",
      needUrl: "يجب إضافة رابط الـ Web App في الكود أولاً (المتغيّر WEB_APP_URL).",
      footer: "روبي ريد — نظام متابعة العمل الإضافي",
      loginTitle: "تسجيل الدخول",
      loginId: "اسم المستخدم",
      loginPassword: "كلمة المرور",
      loginButton: "دخول",
      loginError: "اسم المستخدم أو كلمة المرور غير صحيحة",
      welcomeText: "مرحبًا بكم في لوحة روبي ريد للعمل الإضافي"
    }
  };

  let currentLang = "en";
  let currentWorkers = [];
  let currentState = { key: "", type: "" };

  function applyLanguage(lang){
    currentLang = lang;
    const dict = translations[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = dict.pageTitle;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (dict[key]) el.textContent = dict[key];
    });

    document.querySelectorAll("[data-lang-switch]").forEach(group => {
      group.querySelectorAll("button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    });

    if (currentState.key) setStateMsg(currentState.key, currentState.type);
    const allOpt = document.querySelector('#deptFilter option[value=""]');
    if (allOpt) allOpt.textContent = dict.allDepartments;
  }

  document.querySelectorAll("[data-lang-switch] button").forEach(btn => {
    btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
  });

  /* ============ SPLASH ============ */
  window.addEventListener("load", () => {
    setTimeout(() => {
      document.getElementById("splash").classList.add("fade-out");
      setTimeout(() => {
        document.getElementById("splash").style.display = "none";
        document.getElementById("loginScreen").classList.add("visible");
      }, 600);
    }, 2200);
  });

  /* ============ LOGIN ============ */
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");
  const loginCard = document.querySelector(".login-card");

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("loginId").value.trim();
    const pw = document.getElementById("loginPassword").value;

    if (id === CREDENTIALS.id && pw === CREDENTIALS.password) {
      document.getElementById("loginScreen").classList.remove("visible");
      document.getElementById("dashboard").classList.add("visible");
      initDashboard();
    } else {
      loginError.textContent = translations[currentLang].loginError;
      loginCard.classList.remove("shake");
      void loginCard.offsetWidth;
      loginCard.classList.add("shake");
    }
  });

  /* ============ DASHBOARD ============ */
  const dateInput   = document.getElementById("dateInput");
  const deptFilter  = document.getElementById("deptFilter");
  const tableBody   = document.getElementById("tableBody");
  const stateMsg    = document.getElementById("stateMsg");
  const countValue  = document.getElementById("countValue");
  const displayDate = document.getElementById("displayDate");
  const downloadBtn = document.getElementById("downloadBtn");

  const monthsEn = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function formatDate(dateStr){
    const d = new Date(dateStr + "T00:00:00");
    return `${monthsEn[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  }
  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function setStateMsg(key, type){
    currentState = { key, type };
    stateMsg.textContent = key ? translations[currentLang][key] : "";
    stateMsg.className = "state-msg" + (type ? " " + type : "");
  }

  function populateDepartments(workers){
    const depts = Array.from(new Set(workers.map(w => w.department).filter(Boolean))).sort();
    const dict = translations[currentLang];
    deptFilter.innerHTML = `<option value="">${dict.allDepartments}</option>`;
    depts.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      deptFilter.appendChild(opt);
    });
  }

  function getFilteredRows(){
    const selected = deptFilter.value;
    return selected ? currentWorkers.filter(w => w.department === selected) : currentWorkers;
  }

  function renderTable(){
    const rows = getFilteredRows();
    tableBody.innerHTML = "";
    countValue.textContent = rows.length;
    downloadBtn.disabled = rows.length === 0;

    if (!rows.length) {
      setStateMsg("noWorkers", "");
      return;
    }
    setStateMsg("", "");
    rows.forEach(w => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${escapeHtml(w.code)}</td><td>${escapeHtml(w.name)}</td><td>${escapeHtml(w.department)}</td><td>${escapeHtml(w.jd)}</td><td>${escapeHtml(w.type)}</td>`;
      tableBody.appendChild(tr);
    });
  }

  async function loadData(date){
    tableBody.innerHTML = "";
    countValue.textContent = "—";
    displayDate.textContent = formatDate(date);
    setStateMsg("loading", "");
    currentWorkers = [];
    downloadBtn.disabled = true;
    deptFilter.innerHTML = `<option value="">${translations[currentLang].allDepartments}</option>`;

    if (WEB_APP_URL.includes("PASTE_YOUR")) {
      setStateMsg("needUrl", "error");
      countValue.textContent = "0";
      return;
    }

    try {
      const res = await fetch(`${WEB_APP_URL}?date=${date}`);
      const json = await res.json();

      if (!json.success) {
        setStateMsg("noData", "");
        countValue.textContent = "0";
        return;
      }
      currentWorkers = json.workers || [];
      populateDepartments(currentWorkers);
      renderTable();
    } catch (err) {
      setStateMsg("errorMsg", "error");
      countValue.textContent = "0";
    }
  }

  function downloadExcel(){
    const rows = getFilteredRows();
    if (!rows.length) return;
    const dict = translations[currentLang];

    const aoa = [[dict.tableCode, dict.tableName, dict.tableDept, dict.tableJd, dict.tableType]];
    rows.forEach(w => aoa.push([w.code, w.name, w.department, w.jd, w.type]));

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:12},{wch:24},{wch:18},{wch:24},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Overtime");
    XLSX.writeFile(wb, `Rubyred_Overtime_${dateInput.value}.xlsx`);
  }

  function initDashboard(){
    dateInput.value = todayStr();
    dateInput.addEventListener("change", () => loadData(dateInput.value));
    deptFilter.addEventListener("change", renderTable);
    downloadBtn.addEventListener("click", downloadExcel);
    loadData(dateInput.value);
  }

  applyLanguage("en");
</script>
</body>
</html>
